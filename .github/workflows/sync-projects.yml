name: Sync GitHub projects

on:
  schedule:
    # 07:00 UTC daily
    - cron: "0 7 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-projects
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      - name: Sync projects from GitHub
        run: bun run sync:projects
        env:
          GITHUB_TOKEN: ${{ secrets.PROJECTS_SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Commit changes
        run: |
          if git diff --quiet -- src/data/github-projects.json; then
            echo "No project changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/github-projects.json
          git commit -m "chore: sync github projects"
          git push
